name = TeleNVDA Accessolutions
summary = "Tele NVDA remote assistance"
description = """Allows remote control of and remote access to another machine. This add-on is based on NVDA Remote."""
author = "Accessolutions. Based on work by the Asociación Comunidad Hispanohablante de NVDA and other contributors. Original work by Tyler Spivey <tspivey@pcdesk.net> and Christopher Toth <q@q-continuum.net>"
url = https://github.com/Accessolutions/telenvda-accessolutions
version = 2026.09.12.2225
changelog = """The controlling computer no longer stays silent when the user of the controlled one has turned the speech of their NVDA off. Add remote audio, so that the controlling computer can hear what the controlled one is playing, application by application, without any program other than NVDA. Add screen sharing of the controlled computer, with mouse control when its user allows it. Add a chunked file transfer which is no longer limited to 10 MB, with progress, speed and a SHA-256 check."""
