summary = "Assistance à distance TeleNVDA"
description = """Permet le contrôle et l'accès à distance à un autre ordinateur. Cette extension est basée sur l'Accès distant NVDA."""
changelog = """L'ordinateur contrôleur ne reste plus silencieux lorsque l'utilisateur de l'ordinateur contrôlé a désactivé la parole de son NVDA. Ajouter le son distant, afin que l'ordinateur contrôleur entende ce que joue l'ordinateur contrôlé, application par application, sans aucun programme autre que NVDA. Ajouter le partage de l'écran de l'ordinateur contrôlé, avec le contrôle de la souris lorsque son utilisateur l'autorise. Ajouter un transfert de fichiers par blocs qui n'est plus limité à 10 Mo, avec la progression, le débit et une vérification SHA-256."""
