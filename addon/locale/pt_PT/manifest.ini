summary = "Assistência remota do Tele NVDA"
description = """Permite o controlo remoto e o acesso remoto a outra máquina. Este extra é baseado no NVDA Remote."""
changelog = """Add remote audio, so that the controlling computer can hear what the controlled one is playing, application by application, without any program other than NVDA. Add screen sharing of the controlled computer, with mouse control when its user allows it. Add a chunked file transfer which is no longer limited to 10 MB, with progress, speed and a SHA-256 check."""
