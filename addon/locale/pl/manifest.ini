summary = "TeleNVDA — zdalna pomoc"
description = """Umożliwia zdalne sterowanie innym komputerem i dostęp do niego. Dodatek jest oparty na NVDA Remote."""
changelog = """Komputer kontrolujący odtwarza mowę także wtedy, gdy użytkownik kontrolowanego komputera wyłączy mowę swojego NVDA. Dodano odsłuch dźwięku z kontrolowanego komputera z możliwością wyboru poszczególnych aplikacji, bez potrzeby korzystania z programów innych niż NVDA. Dodano udostępnianie ekranu kontrolowanego komputera oraz sterowanie myszą za zgodą jego użytkownika. Dodano przesyłanie plików w blokach, bez dotychczasowego ograniczenia do 10 MB, ze wskazaniem postępu i szybkości oraz weryfikacją sumy kontrolnej SHA-256."""
