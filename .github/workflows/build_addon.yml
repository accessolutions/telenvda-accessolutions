name: build addon

on:
  push:
    tags: ["*"]
    branches: [ main ]

  pull_request:
    branches: [ teleNVDA ]

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7.0.1

    - run: echo -e "uv\npre-commit\nscons\nmarkdown\npytest==8.4.2">requirements.txt

    - name: Set up Python
      uses: actions/setup-python@v7.0.0
      with:
        python-version: 3.13
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip wheel
        pip install -r requirements.txt
        sudo apt-get update  -y
        sudo apt-get install -y gettext cmake ninja-build gcc-mingw-w64-i686 gcc-mingw-w64-x86-64

    - name: Build libopus x86 and x64
      run: python tools/build_opus.py

    - name: Test libopus wrapper
      run: python -m pytest tests/test_audio_opus.py -q

    - name: Test audio integration
      run: |
        python -m pytest tests -q
        python -m compileall -q addon tests

    # - name: Code checks
      # run: export SKIP=no-commit-to-branch; pre-commit run --all

    - name: building addon
      shell: bash
      run: |
        rm -f ./*.nvda-addon
        if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
          version="${GITHUB_REF_NAME#v}"
          scons "version=${version}"
        else
          scons
        fi
        package="$(find . -maxdepth 1 -type f -name '*.nvda-addon' -print -quit)"
        test -n "$package"
        for entry in \
          globalPlugins/remoteClient/native/opus-LICENSE.txt \
          globalPlugins/remoteClient/native/x86/opus.dll \
          globalPlugins/remoteClient/native/x86/libssp-0.dll \
          globalPlugins/remoteClient/native/x64/opus.dll \
          globalPlugins/remoteClient/native/x64/libssp-0.dll; do
          unzip -Z1 "$package" | grep -Fx "$entry"
        done
        for architecture in x86 x64; do
          if [[ "$architecture" == x86 ]]; then
            objdump=i686-w64-mingw32-objdump
          else
            objdump=x86_64-w64-mingw32-objdump
          fi
          if ! "$objdump" -p "addon/globalPlugins/remoteClient/native/$architecture/opus.dll" | grep -qi 'DLL Name: libssp-0.dll'; then
            echo "$architecture Opus DLL does not declare libssp-0.dll" >&2
            exit 1
          fi
        done
        scons pot

    - uses: actions/upload-artifact@v7.0.1
      with:
        name: packaged_addon
        path: |
          ./*.nvda-addon
          ./*.pot

  upload_release:
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-') }}
    needs: ["build"]
    steps:
    - uses: actions/checkout@v7.0.1
    - name: Remove old packages
      run: rm -f ./*.nvda-addon
    - name: download releases files
      uses: actions/download-artifact@v8.0.1
    - name: Display structure of downloaded files
      run: ls -R
    - name: Calculate sha256
      shell: bash
      run: |
        find . -type f -name '*.nvda-addon' -print0 | while IFS= read -r -d '' file; do
          sha256sum "$file" > "$file.sha256"
        done

    - name: Prepare stable download asset
      shell: bash
      run: |
        addon="$(find . -type f -name '*.nvda-addon' -not -name '*-latest.nvda-addon' | head -n 1)"
        if [[ -z "$addon" ]]; then
          echo "No NVDA add-on package was found" >&2
          exit 1
        fi
        cp "$addon" ./TeleNVDA.Accessolutions-latest.nvda-addon
        sha256sum ./TeleNVDA.Accessolutions-latest.nvda-addon > ./TeleNVDA.Accessolutions-latest.nvda-addon.sha256

    - name: Release
      uses: softprops/action-gh-release@v3.0.3
      with:
        tag_name: ${{ github.ref_name }}
        target_commitish: ${{ github.sha }}
        name: TeleNVDA ${{ github.ref_name }}
        files: |
          **/*.nvda-addon
          **/*.nvda-addon.sha256
          **/*.pot
        body_path: changelog.md
        fail_on_unmatched_files: true
        prerelease: false

  test_opus_windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v7.0.1

    - name: Set up Python
      uses: actions/setup-python@v7.0.0
      with:
        python-version: 3.13

    - name: Install test dependency
      run: python -m pip install pytest==8.4.2

    - name: Test libopus round-trip
      run: python -m pytest tests/test_audio_opus.py -q

    - name: Test audio integration on Windows
      run: |
        python -m pytest tests -q
        python -m compileall -q addon tests
