name: build addon

on:
  push:
    tags: ["*"]
    branches: [ main ]

  pull_request:
    branches: [ teleNVDA ]

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7.0.1

    - run: echo -e "uv\npre-commit\nscons\nmarkdown">requirements.txt

    - name: Set up Python
      uses: actions/setup-python@v7.0.0
      with:
        python-version: 3.13
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip wheel
        pip install -r requirements.txt
        sudo apt-get update  -y
        sudo apt-get install -y gettext

    # - name: Code checks
      # run: export SKIP=no-commit-to-branch; pre-commit run --all

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: helper/go.mod
        cache-dependency-path: helper/go.sum

    # The helper is a Windows executable that is not kept under version control,
    # so it has to be produced here or the add-on would ship without it and
    # screen sharing would report itself as unavailable.
    - name: building screen sharing helper
      shell: bash
      working-directory: helper
      env:
        GOOS: windows
        GOARCH: "386"
        CGO_ENABLED: "0"
      run: |
        mkdir -p ../addon/globalPlugins/remoteClient/helpers
        go build -trimpath -ldflags '-s -w' -o ../addon/globalPlugins/remoteClient/helpers/telenvda_screenshare.exe .
        ls -l ../addon/globalPlugins/remoteClient/helpers

    - name: building addon
      shell: bash
      run: |
        rm -f ./*.nvda-addon
        if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
          version="${GITHUB_REF_NAME#v}"
          scons "version=${version}"
        else
          scons
        fi
        scons pot

    - uses: actions/upload-artifact@v7.0.1
      with:
        name: packaged_addon
        path: |
          ./*.nvda-addon
          ./*.pot

  upload_release:
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-') }}
    needs: ["build"]
    steps:
    - uses: actions/checkout@v7.0.0
    - name: Remove old packages
      run: rm -f ./*.nvda-addon
    - name: download releases files
      uses: actions/download-artifact@v8.0.1
    - name: Display structure of downloaded files
      run: ls -R
    - name: Calculate sha256
      shell: bash
      run: |
        find . -type f -name '*.nvda-addon' -print0 | while IFS= read -r -d '' file; do
          sha256sum "$file" > "$file.sha256"
        done

    - name: Release
      uses: softprops/action-gh-release@v3.0.2
      with:
        tag_name: ${{ github.ref_name }}
        target_commitish: ${{ github.sha }}
        name: TeleNVDA ${{ github.ref_name }}
        files: |
          **/*.nvda-addon
          **/*.nvda-addon.sha256
          **/*.pot
        body_path: changelog.md
        fail_on_unmatched_files: true
        prerelease: false
